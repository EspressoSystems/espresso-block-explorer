server {
    listen 3000;
    listen [::]:3000;

    root /usr/share/nginx/html;
    index index.html;

    # Static JS/CSS assets are content-hashed; cache them indefinitely.
    location /_next/static/ {
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # config.json is regenerated at each container start; never cache it.
    location = /config.json {
        add_header Cache-Control "max-age=86400, s-maxage=86400, public";
    }

    # All other routes serve index.html (client-side routing).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

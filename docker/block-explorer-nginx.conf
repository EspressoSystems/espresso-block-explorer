server {
    listen 3000;
    listen [::]:3000;

    root /usr/share/nginx/html;
    index index.html;

    # Static JS/CSS assets are content-hashed; cache them indefinitely.
    location /_next/static/ {
      expires max;
      add_header Cache-Control "public, immutable";
    }

    # config.json is regenerated at each container start; Only have the client
    # cache it for up to 10 minutes.
    location =/config.json {
      add_header Cache-Control "max-age=86400, s-maxage=86400, public";
    }

    location ~ ^/block/(\d+)/(.*\.txt) {
      try_files /block/0/$2 =404;
      sub_filter_types text/plain;
      sub_filter '__BLOCK_ID__' $1;
      sub_filter_once off;
    }

    # Block detail pages have dynamic sub-paths (/block/<id>).
    # The regex captures the block  ID so sub_filter can inject it into the
    # placeholder baked into the static shell's <title> at build time.
    # The client component overwrites the title again after hydration via
    # React 19's native <title> hoisting.
    location ~ ^/block/(\d+)$ {
      try_files $uri $uri.html /block/0.html =404;
      sub_filter '__BLOCK_ID__' $1;
      sub_filter_once off;
    }

    location ~ ^/transaction/(\d+-\d+)/(.*\.txt) {
      try_files /transaction/0/$2 =404;
      sub_filter_types text/plain;
      sub_filter '__TX_SLUG__' $1;
      sub_filter_once off;
    }

    # Transaction detail pages have dynamic sub-paths (/transaction/<slug>).
    # Same pattern as block detail pages above.
    location ~ ^/transaction/(\d+-\d+)$ {
      try_files $uri $uri.html /transaction/0.html =404;
      sub_filter '__TX_SLUG__' $1;
      sub_filter_once off;
    }


    location =/blocks {
      try_files $uri $uri.html /blocks.html =404;
    }

    location =/transactions {
      try_files $uri $uri.html /transactions.html =404;
    }

    location =/ {
      try_files $uri $uri.html /index.html =404;
    }

    # All other routes serve the appropriate static page (SPA-style routing).
    location / {
      try_files $uri =404;
    }
}
